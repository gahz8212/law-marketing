server {
    listen 80;
    server_name law.memyself.shop;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name law.memyself.shop;

    ssl_certificate /etc/letsencrypt/live/law.memyself.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/law.memyself.shop/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 1. Next.js 프론트엔드 (포트 3000)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 2. FastAPI 백엔드 API (포트 8000)
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    # 3. 정적 이미지 및 오디오 (캐싱)
    location /static/ {
        proxy_pass http://127.0.0.1:8000/static/;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
